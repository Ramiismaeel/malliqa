<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ملّيقة — استوديو المحتوى</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: oklch(96.5% 0.014 82);
        --surface: oklch(99% 0.006 85);
        --sunken: oklch(94% 0.02 80);
        --line: oklch(88.5% 0.028 78);
        --ink: oklch(27% 0.035 45);
        --muted: oklch(45% 0.03 50);
        --primary: oklch(54% 0.185 32);
        --on-primary: oklch(98.5% 0.012 80);
        --olive: oklch(50% 0.105 128);
        --on-olive: oklch(98.5% 0.02 120);
        --saffron: oklch(80% 0.15 80);
        --on-saffron: oklch(27% 0.06 60);
        --ok: oklch(52% 0.13 150);
        --danger: oklch(54% 0.21 22);
        --shadow: 0 1px 2px oklch(27% 0.035 45 / 0.06), 0 6px 20px oklch(27% 0.035 45 / 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(20.5% 0.014 55);
          --surface: oklch(25% 0.016 55);
          --sunken: oklch(22.5% 0.015 55);
          --line: oklch(34% 0.02 55);
          --ink: oklch(93% 0.02 80);
          --muted: oklch(74% 0.02 75);
          --primary: oklch(70% 0.16 38);
          --on-primary: oklch(19% 0.035 40);
          --olive: oklch(72% 0.115 128);
          --on-olive: oklch(20% 0.04 128);
          --saffron: oklch(82% 0.14 82);
          --on-saffron: oklch(24% 0.05 60);
          --ok: oklch(72% 0.14 150);
          --danger: oklch(70% 0.17 22);
          --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 6px 20px oklch(0% 0 0 / 0.25);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .emoji img.art {
        width: 1.2em;
        height: 1.2em;
        vertical-align: -0.2em;
      }
      .emoji {
        font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        font-style: normal;
      }
      .muted {
        color: var(--muted);
      }
      code {
        font: 12.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
        direction: ltr;
        unicode-bidi: isolate;
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 1.5em;
        padding: 0 0.35em;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 6px;
        background: var(--surface);
        font: 11.5px/1.5 ui-monospace, Consolas, monospace;
        color: var(--muted);
      }

      /* ── top bar ── */
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
        padding: 10px 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .logo {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        background: var(--primary);
        font-size: 21px;
      }
      .brand b {
        display: block;
        font-size: 17px;
        line-height: 1.2;
      }
      .brand small {
        color: var(--muted);
        font-size: 12px;
      }
      .stats {
        display: flex;
        flex: 1 1 320px;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        min-width: 0;
      }
      .progress {
        flex: 1 1 200px;
        max-width: 340px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--muted);
      }
      .progress-label b {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        display: flex;
        height: 8px;
        margin-top: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--sunken);
      }
      .bar i {
        display: block;
        height: 100%;
        transition: width 0.3s ease;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 10px;
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 12.5px;
        white-space: nowrap;
      }
      .pill b {
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-inline-start: auto;
      }
      .save-state {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .save-state[data-state="saved"] {
        color: var(--ok);
      }
      .save-state[data-state="error"],
      .save-state[data-state="conflict"] {
        color: var(--danger);
        font-weight: 600;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        font-weight: 600;
        white-space: nowrap;
        transition:
          transform 0.12s ease,
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .btn:hover {
        border-color: var(--primary);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: var(--on-primary);
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.danger:hover {
        border-color: var(--danger);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .banner {
        display: none;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        background: var(--danger);
        color: #fff;
        font-weight: 600;
      }
      .banner.show {
        display: flex;
      }
      .banner .btn {
        color: var(--ink);
      }

      /* ── layout ── */
      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .list-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--surface);
        border-inline-end: 1px solid var(--line);
      }
      .list-tools {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .field,
      textarea,
      select {
        width: 100%;
        min-height: 38px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
      }
      textarea {
        display: block;
        min-height: 110px;
        resize: vertical;
        line-height: 1.7;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: var(--surface);
        font-size: 13px;
        white-space: nowrap;
      }
      .chip span {
        font-size: 11.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--bg);
      }
      .chip[aria-pressed="true"] span {
        color: inherit;
        opacity: 0.75;
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px;
      }
      .list-heading {
        padding: 10px 8px 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 8px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: none;
        text-align: start;
      }
      .row:hover {
        background: var(--bg);
      }
      .row[aria-current="true"] {
        border-color: var(--primary);
        background: color-mix(in oklch, var(--primary) 9%, var(--surface));
      }
      .row .tile {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--sunken);
        font-size: 20px;
      }
      .row .name,
      .row .sub {
        display: block;
      }
      .row .name {
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .sub {
        overflow: hidden;
        font-size: 12px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .marks {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 99px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .mark.course-main {
        background: var(--primary);
        color: var(--on-primary);
      }
      .mark.course-appetizer {
        background: var(--olive);
        color: var(--on-olive);
      }
      .mark.course-dessert {
        background: var(--saffron);
        color: var(--on-saffron);
      }
      .mark.comment {
        background: color-mix(in oklch, var(--danger) 16%, transparent);
        color: var(--danger);
      }
      .mark.ok {
        background: color-mix(in oklch, var(--ok) 18%, transparent);
        color: var(--ok);
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }
      .empty .emoji {
        display: block;
        font-size: 40px;
      }

      /* ── detail ── */
      .detail {
        min-height: 0;
        overflow-y: auto;
        padding: 18px 22px 60px;
      }
      .sheet {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        grid-template-areas: "nav nav" "head head" "body review";
        gap: 16px;
        max-width: 1180px;
        margin-inline: auto;
        animation: rise 0.22s ease both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet {
          animation: none;
        }
      }
      .sheet.single {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "nav" "head" "body";
        max-width: 820px;
      }
      .nav {
        grid-area: nav;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .nav .pos {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .nav .hints {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-inline-start: auto;
        font-size: 12px;
        color: var(--muted);
      }
      .back {
        display: none;
      }
      .card {
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .head {
        grid-area: head;
        display: flex;
        gap: 16px;
      }
      .head .big {
        display: grid;
        flex: none;
        place-items: center;
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: var(--sunken);
        font-size: 46px;
      }
      .head h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }
      .head .en {
        font-size: 13px;
        color: var(--muted);
        direction: ltr;
        unicode-bidi: isolate;
      }
      .head p {
        margin: 4px 0 8px;
      }
      .head .where {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 10px;
        border-radius: 99px;
        background: var(--sunken);
        font-size: 13px;
      }
      .body {
        grid-area: body;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .card h2 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 0 10px;
        font-size: 15px;
      }
      .card h2 small {
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      .ings {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .ings li {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--line);
      }
      .ings li:last-child {
        border-bottom: 0;
      }
      .ings .amount {
        color: var(--muted);
        font-size: 13.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ings .extra {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
      }
      .ings + h2 {
        margin-top: 18px;
      }
      .steps {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      .steps li {
        position: relative;
        padding: 8px 0;
        padding-inline-start: 40px;
        counter-increment: step;
      }
      .steps li::before {
        content: counter(step);
        position: absolute;
        inset-inline-start: 0;
        top: 8px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: color-mix(in oklch, var(--primary) 14%, transparent);
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
      }
      .subs {
        margin: 0;
        padding-inline-start: 18px;
      }

      /* ── review box ── */
      .review {
        grid-area: review;
        position: sticky;
        top: 0;
        align-self: start;
        display: flex;
        flex-direction: column;
        gap: 14px;
        border-color: color-mix(in oklch, var(--primary) 35%, var(--line));
      }
      .review label,
      .form label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        font-weight: 700;
      }
      .review label small,
      .form label small {
        font-weight: 400;
        color: var(--muted);
      }
      .seg {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .seg button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg);
        font-weight: 600;
        transition: transform 0.12s ease;
      }
      .seg button:active {
        transform: scale(0.96);
      }
      .seg button .emoji {
        font-size: 22px;
      }
      .seg button[aria-pressed="true"][data-course="main"] {
        border-color: var(--primary);
        background: var(--primary);
        color: var(--on-primary);
      }
      .seg button[aria-pressed="true"][data-course="appetizer"] {
        border-color: var(--olive);
        background: var(--olive);
        color: var(--on-olive);
      }
      .seg button[aria-pressed="true"][data-course="dessert"] {
        border-color: var(--saffron);
        background: var(--saffron);
        color: var(--on-saffron);
      }
      .seg button[aria-pressed="true"] kbd {
        border-color: transparent;
        background: rgb(255 255 255 / 0.25);
        color: inherit;
      }
      .toggle-ok {
        width: 100%;
      }
      .toggle-ok[aria-pressed="true"] {
        border-color: var(--ok);
        background: color-mix(in oklch, var(--ok) 18%, var(--surface));
        color: var(--ok);
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inline .field {
        width: 76px;
        text-align: center;
        font-size: 18px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 400 !important;
        color: var(--muted);
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .form .wide {
        grid-column: 1 / -1;
      }
      .form-actions {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      /* ── narrow screens: list and detail take turns ── */
      @media (max-width: 1240px) {
        .sheet {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "nav" "head" "review" "body";
          max-width: 820px;
        }
        .review {
          position: static;
        }
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .layout:not(.show-detail) .detail,
        .layout.show-detail .list-pane {
          display: none;
        }
        .back {
          display: inline-flex;
        }
        .nav .hints {
          display: none;
        }
        .detail {
          padding: 12px 12px 60px;
        }
        .head .big {
          width: 64px;
          height: 64px;
          font-size: 34px;
        }
        .form {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo emoji">📝</span>
        <div>
          <b>ملّيقة — استوديو المحتوى</b>
          <small>صفحة داخلية لمراجعة الطبخات · تُحفظ في <code>content/recipe-review.json</code></small>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <span class="save-state" id="save-state" role="status"></span>
        <button class="btn primary" id="btn-new" type="button">+ طبخة جديدة</button>
      </div>
    </header>
    <div class="banner" id="banner" role="alert">
      <span>تغيّر ملف المراجعة على القرص بعد فتح هذه الصفحة. آخر تعديلاتك هنا لم تُحفظ.</span>
      <button class="btn" type="button" id="btn-reload">أعد التحميل</button>
    </div>

    <main class="layout" id="layout">
      <aside class="list-pane">
        <div class="list-tools">
          <input class="field" id="q" type="search" placeholder="ابحث باسم الطبخة أو مكوّن…" aria-label="بحث" />
          <div class="chips" id="filters" role="group" aria-label="تصفية حسب الحالة"></div>
          <select id="cuisine" aria-label="المطبخ"></select>
        </div>
        <div class="list" id="list"></div>
      </aside>
      <section class="detail" id="detail" aria-live="off"></section>
    </main>

    <script>
      "use strict";

      // ── tiny DOM helper: no innerHTML anywhere, so recipe text can never inject markup ──
      function h(tag, attrs, ...children) {
        const el = document.createElement(tag);
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue;
          el.append(child.nodeType ? child : String(child));
        }
        for (const [key, value] of Object.entries(attrs || {})) {
          if (value === null || value === undefined || value === false) continue;
          if (key === "class") el.className = value;
          else if (key === "value") el.value = value;
          else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
          else el.setAttribute(key, value === true ? "" : value);
        }
        return el;
      }
      // An icon is an emoji, or `art:<name>` for a drawing from src/data/food-art.ts.
      const iconNode = (value) => {
        const match = /^art:([a-z0-9-]+)$/.exec(value || "");
        return match ? h("img", { class: "art", src: `/art/${match[1]}.svg`, alt: "" }) : value || "";
      };
      const emoji = (text) => h("span", { class: "emoji", "aria-hidden": "true" }, iconNode(text));

      // Same rules as src/lib/text/arabic.ts, so search behaves like the app.
      function normalize(input) {
        return input
          .normalize("NFKC")
          .replace(/[ً-ٰٟـ]/g, "")
          .replace(/[أإآٱ]/g, "ا")
          .replace(/ة/g, "ه")
          .replace(/ى/g, "ي")
          .replace(/ؤ/g, "و")
          .replace(/ئ/g, "ي")
          .replace(/ء/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ")
          .split(/\s+/)
          .filter(Boolean)
          .map((word) => {
            if (word.length > 3 && word.startsWith("ال")) return word.slice(2);
            if (word.length > 4 && /^[وبفك]ال/.test(word)) return word.slice(3);
            if (word.length > 3 && word.startsWith("لل")) return word.slice(2);
            return word;
          })
          .join(" ");
      }

      const state = {
        recipes: [],
        byId: new Map(),
        courses: [],
        cuisines: [],
        mealTypes: [],
        review: { version: 1, generalNotes: "", recipes: {}, newRecipes: [] },
        rev: "new",
        selected: null, // "r/<recipe id>" | "n/<new recipe id>" | "notes"
        filter: "all",
        cuisine: "all",
        q: "",
        visible: [],
        dirty: false,
        saving: false,
        conflict: false,
        autoAdvance: false,
      };

      const $ = (id) => document.getElementById(id);
      const noteOf = (id) => state.review.recipes[id] || {};
      const courseOf = (id) => state.courses.find((course) => course.id === id);
      const cuisineOf = (id) => state.cuisines.find((cuisine) => cuisine.id === id);
      const mealTypeOf = (id) => state.mealTypes.find((type) => type.id === id);
      // A recipe's course lives in the code; a note holds one only as a requested change.
      const courseIdOf = (recipe, note) => note.course || recipe.course;
      const hasComment = (note) =>
        Boolean((note.comment && note.comment.trim()) || (note.emoji && note.emoji.trim()) || note.course);

      const FILTERS = [
        { id: "all", label: "الكل", test: () => true },
        { id: "main", test: (note, recipe) => courseIdOf(recipe, note) === "main" },
        { id: "appetizer", test: (note, recipe) => courseIdOf(recipe, note) === "appetizer" },
        { id: "dessert", test: (note, recipe) => courseIdOf(recipe, note) === "dessert" },
        { id: "commented", label: "💬 عليها تعديل", test: hasComment },
        { id: "ok", label: "✓ راجعتها", test: (note) => Boolean(note.ok) },
        { id: "unreviewed", label: "لم تُراجع", test: (note) => !note.ok && !hasComment(note) },
      ];

      // ── saving ──────────────────────────────────────────────────────────────
      let saveTimer = 0;

      function setSaveState(kind) {
        const el = $("save-state");
        el.dataset.state = kind;
        el.textContent =
          {
            saved: "✓ محفوظ",
            pending: "… تعديلات غير محفوظة",
            saving: "جارٍ الحفظ…",
            error: "⚠ تعذّر الحفظ — هل الخادم يعمل؟",
            conflict: "⚠ لم تُحفظ — الملف تغيّر",
          }[
            kind
          ] || "";
      }

      function markDirty() {
        state.dirty = true;
        if (state.conflict) return;
        setSaveState("pending");
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 500);
      }

      async function save(keepalive = false) {
        if (state.conflict || !state.dirty) return;
        if (state.saving) return; // the running save reschedules itself when it ends
        state.saving = true;
        state.dirty = false;
        setSaveState("saving");
        let retryIn = 500;
        try {
          const response = await fetch("/api/review", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ baseRev: state.rev, review: state.review }),
            keepalive,
          });
          if (response.status === 409) {
            state.conflict = true;
            state.dirty = true;
            $("banner").classList.add("show");
            setSaveState("conflict");
            return;
          }
          if (!response.ok) throw new Error(await response.text());
          state.rev = (await response.json()).rev;
          setSaveState(state.dirty ? "pending" : "saved");
        } catch (error) {
          console.error(error);
          state.dirty = true;
          retryIn = 4000;
          setSaveState("error");
        } finally {
          state.saving = false;
          if (state.dirty && !state.conflict) {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(save, retryIn);
          }
        }
      }

      window.addEventListener("beforeunload", (event) => {
        if (state.dirty || state.saving) event.preventDefault();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && state.dirty) {
          clearTimeout(saveTimer);
          save(true);
        }
      });

      // ── editing ─────────────────────────────────────────────────────────────
      function patchNote(id, patch) {
        const next = { ...noteOf(id), ...patch };
        for (const key of Object.keys(next)) {
          if (next[key] === undefined || next[key] === "" || next[key] === false) delete next[key];
        }
        delete next.updatedAt;
        if (Object.keys(next).length === 0) delete state.review.recipes[id];
        else state.review.recipes[id] = { ...next, updatedAt: new Date().toISOString() };
        markDirty();
        refreshRow(id);
        renderStats();
        renderFilters();
      }

      function setCourse(id, course) {
        // Picking the course the recipe already has withdraws a requested change.
        const current = state.byId.get(id).course;
        patchNote(id, { course: course === current ? undefined : course });
        refreshReviewBox();
      }

      function newRecipeById(id) {
        return state.review.newRecipes.find((recipe) => recipe.id === id);
      }

      function patchNew(id, patch) {
        const recipe = newRecipeById(id);
        if (!recipe) return;
        Object.assign(recipe, patch, { updatedAt: new Date().toISOString() });
        if (recipe.course === undefined) delete recipe.course;
        markDirty();
        if ("name" in patch || "emoji" in patch || "course" in patch) renderList();
      }

      function addNewRecipe() {
        const recipe = {
          id: `new-${Date.now().toString(36)}`,
          name: "",
          emoji: "",
          cuisine: "",
          mealType: "",
          time: "",
          servings: "",
          description: "",
          ingredients: "",
          steps: "",
          notes: "",
          createdAt: new Date().toISOString(),
        };
        state.review.newRecipes.push(recipe);
        markDirty();
        renderStats();
        select(`n/${recipe.id}`);
        const first = document.querySelector("#detail input");
        if (first) first.focus();
      }

      function deleteNewRecipe(id) {
        const recipe = newRecipeById(id);
        if (!recipe) return;
        if (!confirm(`حذف «${recipe.name || "طبخة بدون اسم"}» من الطبخات الجديدة؟`)) return;
        state.review.newRecipes = state.review.newRecipes.filter((item) => item.id !== id);
        markDirty();
        renderStats();
        select(state.visible[0] ? `r/${state.visible[0]}` : "notes");
      }

      // ── list ────────────────────────────────────────────────────────────────
      function computeVisible() {
        const words = normalize(state.q).split(" ").filter(Boolean);
        const filter = FILTERS.find((item) => item.id === state.filter) || FILTERS[0];
        state.visible = state.recipes
          .filter(
            (recipe) =>
              (state.cuisine === "all" || recipe.cuisine === state.cuisine) &&
              words.every((word) => recipe.search.includes(word)) &&
              filter.test(noteOf(recipe.id), recipe),
          )
          .map((recipe) => recipe.id);
      }

      function recipeRow(recipe) {
        const note = noteOf(recipe.id);
        const course = courseOf(courseIdOf(recipe, note));
        const cuisine = cuisineOf(recipe.cuisine);
        return h(
          "button",
          {
            class: "row",
            type: "button",
            "data-key": `r/${recipe.id}`,
            "aria-current": state.selected === `r/${recipe.id}` ? "true" : null,
            onclick: () => select(`r/${recipe.id}`),
          },
          h("span", { class: "tile emoji" }, iconNode(note.emoji || recipe.emoji)),
          h(
            "span",
            null,
            h("span", { class: "name" }, recipe.name),
            h("span", { class: "sub" }, `${cuisine ? cuisine.label : recipe.cuisine} · ${recipe.total}`),
          ),
          h(
            "span",
            { class: "marks" },
            hasComment(note) && h("span", { class: "mark comment", title: "عليها تعليق أو تعديل مطلوب" }, "💬"),
            note.ok && h("span", { class: "mark ok", title: "راجعتها وهي صحيحة" }, "✓"),
            course && h("span", { class: `mark course-${course.id}`, title: course.label }, course.label),
          ),
        );
      }

      function newRow(recipe) {
        const course = courseOf(recipe.course);
        return h(
          "button",
          {
            class: "row",
            type: "button",
            "data-key": `n/${recipe.id}`,
            "aria-current": state.selected === `n/${recipe.id}` ? "true" : null,
            onclick: () => select(`n/${recipe.id}`),
          },
          h("span", { class: "tile emoji" }, recipe.emoji || "✨"),
          h(
            "span",
            null,
            h("span", { class: "name" }, recipe.name || "طبخة بدون اسم"),
            h("span", { class: "sub" }, "طبخة جديدة مقترحة"),
          ),
          h("span", { class: "marks" }, course && h("span", { class: `mark course-${course.id}` }, course.label)),
        );
      }

      function renderList() {
        const list = $("list");
        const scroll = list.scrollTop;
        const nodes = [
          h(
            "button",
            {
              class: "row",
              type: "button",
              "data-key": "notes",
              "aria-current": state.selected === "notes" ? "true" : null,
              onclick: () => select("notes"),
            },
            h("span", { class: "tile emoji" }, "🗒️"),
            h(
              "span",
              null,
              h("span", { class: "name" }, "ملاحظات عامة"),
              h("span", { class: "sub" }, state.review.generalNotes.trim() ? "فيها ملاحظات" : "أي شيء لا يخص طبخة بعينها"),
            ),
            h("span"),
          ),
        ];
        if (state.review.newRecipes.length > 0) {
          nodes.push(h("div", { class: "list-heading" }, `طبخات جديدة (${state.review.newRecipes.length})`));
          nodes.push(...state.review.newRecipes.map(newRow));
        }
        nodes.push(
          h("div", { class: "list-heading" }, `طبخات التطبيق (${state.visible.length} من ${state.recipes.length})`),
        );
        if (state.visible.length === 0) {
          nodes.push(h("div", { class: "empty" }, emoji("🍽️"), "لا طبخات تطابق هذا البحث أو الفلتر."));
        } else {
          nodes.push(...state.visible.map((id) => recipeRow(state.byId.get(id))));
        }
        list.replaceChildren(...nodes);
        list.scrollTop = scroll;
      }

      function refreshRow(id) {
        const old = document.querySelector(`.row[data-key="r/${CSS.escape(id)}"]`);
        if (old) old.replaceWith(recipeRow(state.byId.get(id)));
      }

      function renderFilters() {
        $("filters").replaceChildren(
          ...FILTERS.map((filter) => {
            const course = courseOf(filter.id);
            const count = state.recipes.filter((recipe) => filter.test(noteOf(recipe.id), recipe)).length;
            return h(
              "button",
              {
                class: "chip",
                type: "button",
                "aria-pressed": String(state.filter === filter.id),
                onclick: () => {
                  state.filter = filter.id;
                  computeVisible();
                  renderFilters();
                  renderList();
                },
              },
              course ? `${course.emoji} ${course.label}` : filter.label,
              h("span", null, count),
            );
          }),
        );
      }

      function renderStats() {
        const total = state.recipes.length;
        const notes = state.recipes.map((recipe) => noteOf(recipe.id));
        const per = state.courses.map(
          (course) => state.recipes.filter((recipe) => courseIdOf(recipe, noteOf(recipe.id)) === course.id).length,
        );
        const colors = ["var(--primary)", "var(--olive)", "var(--saffron)"];
        $("stats").replaceChildren(
          h(
            "div",
            { class: "progress" },
            h(
              "div",
              { class: "progress-label" },
              h("span", null, state.courses.map((course, index) => `${course.label} ${per[index]}`).join(" · ")),
              h("b", null, total),
            ),
            h(
              "div",
              { class: "bar", role: "img", "aria-label": "توزيع الطبخات على التصنيفات" },
              per.map((count, index) =>
                h("i", { style: `width:${total ? (count / total) * 100 : 0}%;background:${colors[index]}` }),
              ),
            ),
          ),
          h("span", { class: "pill" }, "💬 تعديلات ", h("b", null, notes.filter(hasComment).length)),
          h("span", { class: "pill" }, "✓ راجعتها ", h("b", null, notes.filter((note) => note.ok).length)),
          h("span", { class: "pill" }, "✨ جديدة ", h("b", null, state.review.newRecipes.length)),
        );
      }

      // ── detail ──────────────────────────────────────────────────────────────
      function select(key, { scroll = false } = {}) {
        state.selected = key;
        history.replaceState(null, "", `#${key}`);
        $("layout").classList.add("show-detail");
        for (const row of document.querySelectorAll(".row")) {
          if (row.dataset.key === key) row.setAttribute("aria-current", "true");
          else row.removeAttribute("aria-current");
        }
        renderDetail();
        $("detail").scrollTop = 0;
        if (scroll) {
          const row = document.querySelector('.row[aria-current="true"]');
          if (row) row.scrollIntoView({ block: "nearest" });
        }
      }

      /** Moves to the next/previous recipe of the filtered list. */
      function step(delta) {
        const current = state.selected && state.selected.startsWith("r/") ? state.selected.slice(2) : null;
        const index = current ? state.visible.indexOf(current) : -1;
        const next = state.visible[index === -1 ? 0 : index + delta];
        if (!next) {
          refreshReviewBox();
          return;
        }
        // Re-filter now, so a recipe that no longer matches leaves the list once you move on.
        computeVisible();
        renderList();
        select(`r/${next}`, { scroll: true });
      }

      function backButton() {
        return h(
          "button",
          { class: "btn back", type: "button", onclick: () => $("layout").classList.remove("show-detail") },
          "→ القائمة",
        );
      }

      function reviewBox(recipe) {
        const note = noteOf(recipe.id);
        return h(
          "aside",
          { class: "card review", id: "review-box" },
          h(
            "div",
            null,
            h(
              "label",
              null,
              "التصنيف ",
              note.course && h("small", null, `(تغيير مطلوب — في التطبيق الآن: ${courseOf(recipe.course).label})`),
            ),
            h(
              "div",
              { class: "seg", role: "group", "aria-label": "التصنيف" },
              state.courses.map((course, index) =>
                h(
                  "button",
                  {
                    type: "button",
                    "data-course": course.id,
                    "aria-pressed": String(courseIdOf(recipe, note) === course.id),
                    onclick: () => setCourse(recipe.id, course.id),
                  },
                  emoji(course.emoji),
                  course.label,
                  h("kbd", null, index + 1),
                ),
              ),
            ),
          ),
          h(
            "div",
            null,
            h(
              "label",
              { for: "comment" },
              "تعليق أو تصحيح ",
              h("small", null, "— ما الخطأ أو الناقص؟"),
            ),
            h("textarea", {
              id: "comment",
              maxlength: 8000,
              placeholder: "مثال: ينقصها الثوم · وقت الطبخ 40 دقيقة لا 20 · الخطوة 3 غير صحيحة لأن…",
              value: note.comment || "",
              oninput: (event) => patchNote(recipe.id, { comment: event.target.value }),
            }),
          ),
          h(
            "div",
            { class: "inline" },
            h("label", { for: "alt-emoji", style: "margin:0;flex:1" }, "أيقونة بديلة ", h("small", null, "(اختياري)")),
            h("input", {
              class: "field emoji",
              id: "alt-emoji",
              maxlength: 16,
              placeholder: recipe.emoji.startsWith("art:") ? "🍽️" : recipe.emoji,
              value: note.emoji || "",
              oninput: (event) => patchNote(recipe.id, { emoji: event.target.value.trim() }),
            }),
          ),
          h(
            "button",
            {
              class: "btn toggle-ok",
              type: "button",
              "aria-pressed": String(Boolean(note.ok)),
              onclick: () => {
                const ok = !noteOf(recipe.id).ok;
                patchNote(recipe.id, { ok });
                if (ok && state.autoAdvance) step(1);
                else refreshReviewBox();
              },
            },
            note.ok ? "✓ راجعتها وهي صحيحة" : "علّمها: راجعتها وهي صحيحة",
          ),
          h(
            "label",
            { class: "check" },
            h("input", {
              type: "checkbox",
              checked: state.autoAdvance,
              onchange: (event) => {
                state.autoAdvance = event.target.checked;
                try {
                  localStorage.setItem("studio.autoAdvance", state.autoAdvance ? "1" : "");
                } catch {}
              },
            }),
            "انتقل للطبخة التالية بعد تعليمها «راجعتها»",
          ),
        );
      }

      function refreshReviewBox() {
        const box = $("review-box");
        const recipe = state.selected && state.selected.startsWith("r/") && state.byId.get(state.selected.slice(2));
        if (box && recipe) box.replaceWith(reviewBox(recipe));
      }

      function ingredientList(items) {
        return h(
          "ul",
          { class: "ings" },
          items.map((item) =>
            h(
              "li",
              null,
              emoji(item.emoji),
              h(
                "span",
                null,
                item.name,
                item.note && h("span", { class: "muted" }, ` — ${item.note}`),
                item.members.length > 0 && h("span", { class: "extra" }, `أيّ نوع: ${item.members.join("، ")}`),
              ),
              h("span", { class: "amount" }, item.amount),
            ),
          ),
        );
      }

      function recipeDetail(recipe) {
        const cuisine = cuisineOf(recipe.cuisine);
        const mealType = mealTypeOf(recipe.mealType);
        const required = recipe.ingredients.filter((item) => !item.optional);
        const optional = recipe.ingredients.filter((item) => item.optional);
        const index = state.visible.indexOf(recipe.id);
        return h(
          "div",
          { class: "sheet" },
          h(
            "div",
            { class: "nav" },
            backButton(),
            h("button", { class: "btn", type: "button", disabled: index <= 0, onclick: () => step(-1) }, "↑ السابقة"),
            h(
              "button",
              {
                class: "btn",
                type: "button",
                disabled: index === -1 ? state.visible.length === 0 : index >= state.visible.length - 1,
                onclick: () => step(1),
              },
              "↓ التالية",
            ),
            h("span", { class: "pos" }, index === -1 ? "خارج الفلتر الحالي" : `${index + 1} / ${state.visible.length}`),
            h(
              "span",
              { class: "hints" },
              h("span", null, h("kbd", null, "↑"), " ", h("kbd", null, "↓"), " تنقّل"),
              h("span", null, h("kbd", null, "1"), " ", h("kbd", null, "2"), " ", h("kbd", null, "3"), " تصنيف"),
              h("span", null, h("kbd", null, "C"), " تعليق"),
              h("span", null, h("kbd", null, "/"), " بحث"),
            ),
          ),
          h(
            "header",
            { class: "card head" },
            h("div", { class: "big emoji" }, iconNode(recipe.emoji)),
            h(
              "div",
              { style: "min-width:0" },
              h("h1", null, recipe.name),
              recipe.nameEn && h("div", { class: "en" }, recipe.nameEn),
              h("p", null, recipe.description),
              h(
                "div",
                { class: "tags" },
                h("span", { class: "tag" }, emoji(cuisine ? cuisine.emoji : "🍽️"), cuisine ? cuisine.label : recipe.cuisine),
                h("span", { class: "tag" }, emoji(mealType ? mealType.emoji : "🍽️"), mealType ? mealType.label : recipe.mealType),
                h("span", { class: "tag" }, recipe.difficulty),
                h("span", { class: "tag" }, `⏱ ${recipe.total} (${recipe.bucket}) — تحضير ${recipe.prep} · طبخ ${recipe.cook}`),
                h("span", { class: "tag" }, `يكفي ${recipe.servings}`),
                recipe.advancePrep && h("span", { class: "tag" }, recipe.advancePrep),
              ),
              h(
                "div",
                { class: "where" },
                h("code", null, recipe.id),
                h("code", null, recipe.file),
                !recipe.hasOwnEmoji && h("span", null, "بلا أيقونة خاصة — تظهر أيقونة المطبخ"),
              ),
            ),
          ),
          reviewBox(recipe),
          h(
            "div",
            { class: "body" },
            h(
              "section",
              { class: "card" },
              h("h2", null, "المكونات الأساسية", h("small", null, `${required.length}`)),
              ingredientList(required),
              optional.length > 0 && h("h2", null, "اختيارية — يمكن إضافتها", h("small", null, `${optional.length}`)),
              optional.length > 0 && ingredientList(optional),
            ),
            recipe.substitutes.length > 0 &&
              h(
                "section",
                { class: "card" },
                h("h2", null, "البدائل"),
                h(
                  "ul",
                  { class: "subs" },
                  recipe.substitutes.map((sub) =>
                    h(
                      "li",
                      null,
                      `بدل ${sub.for}: ${sub.use.join(" أو ")}`,
                      sub.note && h("span", { class: "muted" }, ` — ${sub.note}`),
                    ),
                  ),
                ),
              ),
            h(
              "section",
              { class: "card" },
              h("h2", null, "الأدوات"),
              recipe.equipment.length === 0
                ? h("span", { class: "muted" }, "لا تحتاج أدوات طبخ.")
                : h(
                    "div",
                    { class: "tags" },
                    recipe.equipment.map((item) =>
                      h("span", { class: "tag" }, item.label, item.optional && h("span", { class: "muted" }, " (اختياري)")),
                    ),
                  ),
            ),
            h(
              "section",
              { class: "card" },
              h("h2", null, "طريقة التحضير", h("small", null, `${recipe.steps.length} خطوات`)),
              h("ol", { class: "steps" }, recipe.steps.map((text) => h("li", null, text))),
            ),
            recipe.tags.length > 0 &&
              h(
                "section",
                { class: "card" },
                h("h2", null, "وسوم"),
                h("div", { class: "tags" }, recipe.tags.map((tag) => h("span", { class: "tag" }, tag))),
              ),
          ),
        );
      }

      function field(label, hint, control, wide) {
        return h("div", { class: wide ? "wide" : null }, h("label", null, label, hint && h("small", null, ` ${hint}`)), control);
      }

      function newRecipeDetail(recipe) {
        const bind = (key) => ({
          value: recipe[key] || "",
          oninput: (event) => patchNew(recipe.id, { [key]: event.target.value }),
        });
        return h(
          "div",
          { class: "sheet single" },
          h("div", { class: "nav" }, backButton(), h("span", { class: "pos" }, "طبخة جديدة مقترحة — تُضاف إلى التطبيق لاحقاً")),
          h(
            "div",
            { class: "body" },
            h(
              "section",
              { class: "card form" },
              field("اسم الطبخة", "", h("input", { class: "field", maxlength: 200, placeholder: "مثال: يبرق", ...bind("name") })),
              field("الأيقونة", "(إيموجي)", h("input", { class: "field emoji", maxlength: 16, placeholder: "🍲", ...bind("emoji") })),
              field(
                "التصنيف",
                "",
                h(
                  "div",
                  { class: "seg", role: "group", "aria-label": "التصنيف" },
                  state.courses.map((course) =>
                    h(
                      "button",
                      {
                        type: "button",
                        "data-course": course.id,
                        "aria-pressed": String(recipe.course === course.id),
                        onclick: () => {
                          patchNew(recipe.id, { course: recipe.course === course.id ? undefined : course.id });
                          renderDetail();
                        },
                      },
                      emoji(course.emoji),
                      course.label,
                    ),
                  ),
                ),
                true,
              ),
              field(
                "المطبخ",
                "",
                h(
                  "select",
                  { ...bind("cuisine"), onchange: (event) => patchNew(recipe.id, { cuisine: event.target.value }) },
                  h("option", { value: "" }, "— اختر —"),
                  state.cuisines.map((cuisine) => h("option", { value: cuisine.id }, `${cuisine.emoji} ${cuisine.label}`)),
                ),
              ),
              field(
                "النوع",
                "",
                h(
                  "select",
                  { ...bind("mealType"), onchange: (event) => patchNew(recipe.id, { mealType: event.target.value }) },
                  h("option", { value: "" }, "— اختر —"),
                  state.mealTypes.map((type) => h("option", { value: type.id }, `${type.emoji} ${type.label}`)),
                ),
              ),
              field("الوقت", "", h("input", { class: "field", maxlength: 200, placeholder: "تحضير 20 د، طبخ 45 د", ...bind("time") })),
              field("تكفي", "", h("input", { class: "field", maxlength: 100, placeholder: "4 أشخاص", ...bind("servings") })),
              field(
                "وصف قصير",
                "",
                h("input", { class: "field", maxlength: 1000, placeholder: "سطر واحد يعرّف بالطبخة", ...bind("description") }),
                true,
              ),
              field(
                "المكونات",
                "— مكوّن في كل سطر، مع الكمية إن وُجدت",
                h("textarea", { rows: 8, maxlength: 8000, placeholder: "500 غ لحم مفروم\n2 بصل\nملح وفلفل", ...bind("ingredients") }),
                true,
              ),
              field(
                "طريقة التحضير",
                "— خطوة في كل سطر",
                h("textarea", { rows: 8, maxlength: 16000, placeholder: "اقلِ البصل حتى يذبل…", ...bind("steps") }),
                true,
              ),
              field(
                "ملاحظات",
                "— بدائل، أدوات، نقع مسبق، أي شيء آخر",
                h("textarea", { rows: 4, maxlength: 8000, ...bind("notes") }),
                true,
              ),
              h(
                "div",
                { class: "wide form-actions" },
                h("span", { class: "muted", style: "font-size:13px" }, "تُحفظ تلقائياً أثناء الكتابة."),
                h("button", { class: "btn danger", type: "button", onclick: () => deleteNewRecipe(recipe.id) }, "حذف هذه الطبخة"),
              ),
            ),
          ),
        );
      }

      function notesDetail() {
        return h(
          "div",
          { class: "sheet single" },
          h("div", { class: "nav" }, backButton()),
          h(
            "div",
            { class: "body" },
            h(
              "section",
              { class: "card" },
              h("h2", null, "ملاحظات عامة"),
              h(
                "p",
                { class: "muted", style: "margin-top:0" },
                "اكتب هنا ما لا يخص طبخة واحدة: مكوّن ناقص من القاموس، تسمية تريد تغييرها في كل الطبخات، فكرة لتصنيف جديد…",
              ),
              h("textarea", {
                rows: 16,
                maxlength: 20000,
                value: state.review.generalNotes,
                oninput: (event) => {
                  state.review.generalNotes = event.target.value;
                  markDirty();
                },
              }),
            ),
          ),
        );
      }

      function renderDetail() {
        const key = state.selected || "";
        let node = null;
        if (key.startsWith("r/") && state.byId.has(key.slice(2))) node = recipeDetail(state.byId.get(key.slice(2)));
        else if (key.startsWith("n/") && newRecipeById(key.slice(2))) node = newRecipeDetail(newRecipeById(key.slice(2)));
        else if (key === "notes") node = notesDetail();
        $("detail").replaceChildren(node || h("div", { class: "empty" }, emoji("👈"), "اختر طبخة من القائمة."));
      }

      // ── keyboard ────────────────────────────────────────────────────────────
      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const typing = target instanceof HTMLElement && target.matches("input, textarea, select");
        if (event.key === "Escape" && typing) {
          target.blur();
          return;
        }
        if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
        const recipeId = state.selected && state.selected.startsWith("r/") ? state.selected.slice(2) : null;
        if (event.key === "ArrowDown" || event.key === "j") {
          event.preventDefault();
          step(1);
        } else if (event.key === "ArrowUp" || event.key === "k") {
          event.preventDefault();
          step(-1);
        } else if (recipeId && ["1", "2", "3"].includes(event.key)) {
          const course = state.courses[Number(event.key) - 1];
          if (course) setCourse(recipeId, course.id);
        } else if (recipeId && (event.key === "c" || event.key === "C" || event.key === "ؤ")) {
          event.preventDefault();
          $("comment").focus();
        } else if (event.key === "/") {
          event.preventDefault();
          $("layout").classList.remove("show-detail");
          $("q").focus();
        }
      });

      // ── start ───────────────────────────────────────────────────────────────
      async function start() {
        const [catalog, saved] = await Promise.all([
          fetch("/api/catalog").then((response) => response.json()),
          fetch("/api/review").then((response) => {
            if (!response.ok) throw new Error("ملف المراجعة content/recipe-review.json تالف — أصلحه ثم أعد التحميل.");
            return response.json();
          }),
        ]);
        state.recipes = catalog.recipes;
        state.byId = new Map(catalog.recipes.map((recipe) => [recipe.id, recipe]));
        state.courses = catalog.courses;
        state.cuisines = catalog.cuisines;
        state.mealTypes = catalog.mealTypes;
        state.review = saved.review;
        state.rev = saved.rev;
        try {
          state.autoAdvance = Boolean(localStorage.getItem("studio.autoAdvance"));
        } catch {}

        $("cuisine").replaceChildren(
          h("option", { value: "all" }, `كل المطابخ (${state.recipes.length})`),
          ...state.cuisines
            .filter((cuisine) => cuisine.count > 0)
            .map((cuisine) => h("option", { value: cuisine.id }, `${cuisine.emoji} ${cuisine.label} (${cuisine.count})`)),
        );
        $("cuisine").addEventListener("change", (event) => {
          state.cuisine = event.target.value;
          computeVisible();
          renderList();
        });
        $("q").addEventListener("input", (event) => {
          state.q = event.target.value;
          computeVisible();
          renderList();
        });
        $("btn-new").addEventListener("click", addNewRecipe);
        $("btn-reload").addEventListener("click", () => {
          // The banner already said these edits are lost; skip the browser's own warning.
          state.dirty = false;
          location.reload();
        });

        // Opening a pasted link such as #r/mujaddara in the same tab.
        window.addEventListener("hashchange", () => {
          const key = decodeURIComponent(location.hash.slice(1));
          if (key && key !== state.selected) select(key, { scroll: true });
        });

        computeVisible();
        renderStats();
        renderFilters();
        renderList();
        setSaveState("saved");

        const fromHash = decodeURIComponent(location.hash.slice(1));
        const wide = matchMedia("(min-width: 861px)").matches;
        if (fromHash) select(fromHash, { scroll: true });
        else if (wide && state.visible[0]) select(`r/${state.visible[0]}`);
        else renderDetail();
        if (!fromHash && !wide) $("layout").classList.remove("show-detail");
      }

      start().catch((error) => {
        console.error(error);
        $("detail").replaceChildren(
          h("div", { class: "empty" }, emoji("⚠️"), error instanceof Error ? error.message : "تعذّر تحميل البيانات."),
        );
      });
    </script>
  </body>
</html>
